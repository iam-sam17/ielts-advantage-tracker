name: Auto-Sync IELTS Advantage Vault

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-vault:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔄 Run YouTube Auto-Sync Engine
        run: |
          python3 sync_vault.py

      - name: 🚀 Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain videos_data.js)" ]; then
            git add videos_data.js
            git commit -m "🤖 Auto-sync: Update IELTS Vault masterclasses [skip ci]"
            git push
            echo "✅ Successfully synced and pushed new videos to Vault!"
          else
            echo "✨ Vault is already up to date. No changes to commit."
          fi
